name: Deploy Golf Distance Navi

on:
  push:
    branches: ["main"]
    paths:
      - "golf-distance-navi/**"
      - ".github/workflows/golf-distance-navi-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "golf-distance-navi-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Golf Distance Navi
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./golf-distance-navi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
