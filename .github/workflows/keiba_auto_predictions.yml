name: Keiba AI automatic pre-race predictions

on:
  push:
    branches:
      - feature/ver-1.12-online-learning
  workflow_dispatch:
    inputs:
      mode:
        description: "auto / morning / pre_race / settle / learn"
        required: false
        default: "auto"
      target_date:
        description: "YYYY-MM-DD (blank = today JST)"
        required: false
        default: ""

  schedule:
    # GitHub cron is UTC.
    # 08:30 JST on Sat/Sun/Mon (previous UTC day 23:30).
    - cron: "30 23 * * 5,6,0"
    # Every 20 minutes from 09:00 to 16:40 JST on Sat/Sun/Mon.
    - cron: "*/20 0-7 * * 6,0,1"
    # 17:30 JST on Sat/Sun/Mon: automatic result settlement.
    - cron: "30 8 * * 6,0,1"
    # Tuesday 03:30 JST: evaluate a challenger when >=200 new settled races exist.
    - cron: "30 18 * * 1"

permissions:
  contents: write

concurrency:
  group: keiba-ai-prediction-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import and regression smoke checks
        run: |
          python -m py_compile automation_runner.py online_learning.py streamlit_app.py
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from race_day_context import _race_no_int_safe
          from model_compare import _calibrate_histgb_probabilities
          import automation_runner
          import online_learning

          assert _race_no_int_safe("1R") == 1
          assert _race_no_int_safe("01R") == 1
          assert _race_no_int_safe(1) == 1
          assert online_learning.MIN_NEW_RACES >= 200
          assert online_learning.BASE_CHAMPION_VERSION == "base-1.12-calibrated"

          import joblib
          pkg=joblib.load("data/cloud_model.joblib")
          active=[
              k for k,v in (pkg.get("weights") or {}).items()
              if float(v)>0
          ]
          assert active == ["histgb"], f"unexpected active models: {active}"
          safe_meta={
              k:v for k,v in pkg.items()
              if k not in {"trained_models"}
          }
          print("MODEL_PACKAGE_META",safe_meta)

          p1,p3=_calibrate_histgb_probabilities(
              pd.Series([0.60,0.30,0.10]),
              pd.Series([0.80,0.60,0.40]),
          )
          assert abs(float(p1.sum())-1.0) < 1e-9
          assert ((p1>=0)&(p1<=1)).all()
          assert ((p3>=p1)&(p3<=1)).all()

          app=Path("streamlit_app.py").read_text(encoding="utf-8")
          assert app.index("online_adapter=load_online_adapter()") < app.index(
              "if online_adapter is not None:"
          )
          print("Regression smoke checks OK")
          PY

      - name: Run automatic prediction / settlement / learning
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEIBA_HISTORY_BRANCH: prediction-history
        run: |
          MODE="${{ github.event.inputs.mode }}"
          DATE="${{ github.event.inputs.target_date }}"
          SCHEDULE="${{ github.event.schedule }}"
          if [ -z "$MODE" ]; then
            if [ "$SCHEDULE" = "30 18 * * 1" ]; then
              MODE="learn"
            else
              MODE="auto"
            fi
          fi
          if [ -n "$DATE" ]; then
            python automation_runner.py --mode "$MODE" --date "$DATE"
          else
            python automation_runner.py --mode "$MODE"
          fi
